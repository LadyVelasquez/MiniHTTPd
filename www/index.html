<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniHTTPd</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="cielo">
        <header class="encabezado">
            <h1>MiniHTTPd</h1>
            <p class="autor">Lady Celina Velasquez</p>
        </header>

        <section class="escena-foto">
            <img src="image.png" alt="El Fantasma de la Ópera" class="foto-principal">
            <div class="nube-deco nube-izq" aria-hidden="true"></div>
            <div class="nube-deco nube-der" aria-hidden="true"></div>
            <div class="nube-deco nube-arriba" aria-hidden="true"></div>
        </section>

        <section class="nubes-letra">
            <article class="nube-verso">
                <p class="verso">
                    In sleep he sang to me, in dreams he came<br>
                    That voice which calls to me and speaks my name<br>
                    And do I dream again? For now I find<br>
                    The Phantom of the Opera is there inside my mind
                </p>
                <p class="credito">— The Phantom of the Opera (Andrew Lloyd Webber / Charles Hart)</p>
            </article>
        </section>
    </main>
</body>
</html>
